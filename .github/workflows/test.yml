name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The suites that need no database. The others write to production and stay manual.
      # usfm-parser.test.ts reads Bible source files that are not in this repo.
      - run: bun test $(ls tests/unit/*.test.ts | grep -v usfm-parser) tests/integration/token-access.test.ts
      - run: bunx biome check src/lib/token-access.ts src/lib/app-tokens.ts src/lib/sessions.ts src/lib/auth-store.ts src/lib/app-status.ts src/lib/app-review-mail.ts src/lib/consents.ts src/lib/account-store.ts src/lib/supabase-admin.ts src/validators/app-schemas.ts src/middleware/auth.ts
