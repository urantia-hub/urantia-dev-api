name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The suites that need no database. The others write to production and stay manual.
      - run: bun test tests/unit tests/integration/token-access.test.ts
      - run: bunx biome check src/lib/token-access.ts src/middleware/auth.ts
