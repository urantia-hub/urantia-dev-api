name = "urantia-dev-api"
main = "src/index.ts"
compatibility_date = "2026-03-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "api.urantia.dev", custom_domain = true }
]

# Our own apps. A reader does not see the consent screen for them. Not a secret.
[vars]
FIRST_PARTY_APP_IDS = "urantiahub-app"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9a44af1aa9224a4f8bfc4585087440dc"

[[r2_buckets]]
binding = "APP_LOGOS"
bucket_name = "urantia-app-logos"

# Cache for query embeddings (keyed by sha256(q)) and filter counts.
# Create with: wrangler kv:namespace create SEARCH_CACHE
# Then replace the id below with the returned id.
[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "30a200787c5445a1a998582a112fd1f8"

# Per-client limit for POST /feedback: 5 per minute and 10 per 15 minutes.
# One Durable Object per IP, so every isolate counts against the same number.
# The rules live in src/lib/feedback-limiter.ts.
[[durable_objects.bindings]]
name = "FEEDBACK_LIMITER"
class_name = "FeedbackRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackRateLimiter"]

# A coarse cap on total feedback volume (and the email fan-out) from all IPs.
# The Workers Rate Limiting binding counts per machine and syncs late, so it
# suits a flood backstop and not a low per-client limit. `period` accepts 10
# or 60 seconds. `namespace_id` is any integer unique in the account.
[[ratelimits]]
name = "FEEDBACK_GLOBAL_LIMITER"
namespace_id = "6602"

  [ratelimits.simple]
  limit = 30
  period = 60
